<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questions from Claude</title>
<style>
:root {
  --bg: #f5f4ef; --surface: #ffffff; --surface-2: #efede6; --text: #1f1e1b; --muted: #6c6962;
  --border: #e1ded5; --border-strong: #cbc7bc; --accent: #c15f3c; --accent-soft: #f7e7df;
  --accent-text: #ffffff; --ok: #2e7d4f; --ok-soft: #e2f1e7; --warn: #b5482a; --code: #ebe8e0;
  --shadow: 0 1px 2px rgba(30, 25, 15, .05), 0 4px 16px rgba(30, 25, 15, .04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a18; --surface: #252421; --surface-2: #2e2d29; --text: #ecebe6; --muted: #a29f97;
    --border: #383632; --border-strong: #4a4843; --accent: #e3865f; --accent-soft: #3b2a22;
    --accent-text: #1b1a18; --ok: #62c38a; --ok-soft: #1f3328; --warn: #ec9070; --code: #34332f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a18; --surface: #252421; --surface-2: #2e2d29; --text: #ecebe6; --muted: #a29f97;
  --border: #383632; --border-strong: #4a4843; --accent: #e3865f; --accent-soft: #3b2a22;
  --accent-text: #1b1a18; --ok: #62c38a; --ok-soft: #1f3328; --warn: #ec9070; --code: #34332f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 88px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
code { font: .9em ui-monospace, "Cascadia Code", Consolas, monospace; background: var(--code); padding: .1em .35em; border-radius: 4px; }
button { font: inherit; color: inherit; }

.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.top-inner { max-width: 780px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
.brand { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj { display: inline-block; max-width: 40%; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; font: 600 12px ui-monospace, "Cascadia Code", Consolas, monospace; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 8px; margin-right: 10px; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { width: 120px; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
#bar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease, background .25s; }
#bar-fill.full { background: var(--ok); }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
.icon-btn svg { width: 17px; height: 17px; }

main { max-width: 780px; margin: 0 auto; padding: 16px 16px 100px; }
.intro { color: var(--muted); margin: 0 0 12px; }
.intro:empty { display: none; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 20px 4px 8px; }
.section-title:first-child { margin-top: 4px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 6px; margin-bottom: 10px; box-shadow: var(--shadow); transition: border-color .2s; }
.card.attention { border-color: var(--warn); animation: nudge .35s ease; }
@keyframes nudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.q-head { display: flex; gap: 12px; align-items: flex-start; }
.num { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); margin-top: 1px; transition: background .2s, color .2s; }
.card.answered .num { background: var(--ok-soft); color: var(--ok); }
.q-text { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.45; }
.q-context { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
.q-body { margin: 10px 0 0 36px; border: 0; padding: 0; min-width: 0; transition: opacity .2s; }
.card.delegated .q-body { opacity: .4; }
.multi-hint { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.opts { display: grid; gap: 6px; }

.opt { display: flex; gap: 10px; align-items: flex-start; padding: 7px 10px; border: 1px solid var(--border); border-radius: 9px; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--border-strong); }
.opt:has(input.choice:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input.choice { accent-color: var(--accent); margin: 3px 0 0; flex: none; width: 16px; height: 16px; }
.opt-main { flex: 1; min-width: 0; }
.opt-label { font-weight: 500; }
.opt-desc { display: block; color: var(--muted); font-size: 13px; }
.badge.optional { background: var(--surface-2); color: var(--muted); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); margin-left: 6px; vertical-align: 1px; }
.other-text, textarea { width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.other-text { margin-top: 5px; padding: 6px 9px; }
textarea { resize: vertical; min-height: 64px; display: block; }
.other-text:focus, textarea:focus, .opt:focus-within { outline: none; border-color: var(--accent); }
.card :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.q-foot { display: flex; gap: 2px; flex-wrap: wrap; margin: 4px 0 0 28px; }
.link-btn { border: 0; background: none; padding: 4px 8px; border-radius: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.link-btn:hover { background: var(--surface-2); color: var(--text); }
.link-btn[aria-pressed="true"] { color: var(--accent); font-weight: 500; }
.note-wrap { margin: 4px 0 8px 36px; }
.note-wrap textarea { min-height: 48px; font-size: 14px; }

.submit-bar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--border); }
.submit-inner { max-width: 780px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; justify-content: flex-end; }
.hint { margin: 0; flex: 1; font-size: 13px; color: var(--muted); }
.hint.ready { color: var(--ok); }
.hint.error { color: var(--warn); }
.primary { border: 0; background: var(--accent); color: var(--accent-text); font-weight: 600; padding: 10px 20px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
.primary:hover { filter: brightness(1.06); }
.primary:disabled { opacity: .6; cursor: default; }
kbd { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

.done { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; padding: 16px; z-index: 20; }
.done[hidden] { display: none; }
.done-box { text-align: center; max-width: 420px; }
.done-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; margin: 0 auto 16px; }
.done h1 { font-size: 22px; margin: 0 0 8px; }
.done p { color: var(--muted); margin: 0; }

.card.cond:not([hidden]) { animation: appear .25s ease; }
@keyframes appear { from { opacity: 0; transform: translateY(-4px); } }
.preview { margin: 6px 0 2px; padding: 8px 10px; background: var(--code); border-radius: 6px; font: 12px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace; white-space: pre; overflow: auto; max-height: 280px; color: var(--text); }

.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: rank; }
.rank-item { counter-increment: rank; display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px 7px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); cursor: grab; }
.rank-item:hover { border-color: var(--border-strong); }
.rank-item.dragging { opacity: .45; border-style: dashed; }
.rank-pos::before { content: counter(rank); }
.rank-pos { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.grip { color: var(--muted); line-height: 22px; user-select: none; }
.rank-btns { display: flex; gap: 2px; flex: none; }
.rank-btn { border: 1px solid transparent; background: none; border-radius: 6px; width: 26px; height: 24px; cursor: pointer; color: var(--muted); }
.rank-btn:hover { background: var(--surface-2); color: var(--text); }
.rank-item:first-child .rank-btn:first-child, .rank-item:last-child .rank-btn:last-child { visibility: hidden; }

.scale-wrap { display: inline-block; max-width: 100%; }
.scale { display: flex; gap: 6px; flex-wrap: wrap; }
.scale-opt { position: relative; cursor: pointer; }
.scale-input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.scale-opt span { display: grid; place-items: center; min-width: 40px; height: 38px; padding: 0 8px; border: 1px solid var(--border); border-radius: 9px; font-weight: 600; font-variant-numeric: tabular-nums; transition: border-color .15s, background .15s; }
.scale-opt:hover span { border-color: var(--border-strong); }
.scale-input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.scale-input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.scale-labels { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 5px; }

@media (max-width: 560px) {
  .bar { width: 64px; }
  .q-body, .note-wrap { margin-left: 0; }
  .q-foot { margin-left: -8px; }
  .card { padding: 12px 12px 6px; }
  .hint kbd, .hint .kbd-part { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand" id="title"></div>
    <div class="progress"><span id="progress-text"></span><div class="bar"><div id="bar-fill"></div></div></div>
    <button id="theme" class="icon-btn" type="button"></button>
  </div>
</header>
<main>
  <p id="intro" class="intro"></p>
  <form id="form" novalidate></form>
</main>
<div class="submit-bar">
  <div class="submit-inner">
    <p id="hint" class="hint" aria-live="polite"></p>
    <button id="submit" type="button" class="primary"></button>
  </div>
</div>
<div id="done" class="done" hidden>
  <div class="done-box">
    <div class="done-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1 id="done-title"></h1>
    <p id="done-text"></p>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;

const STRINGS = {
  en: {
    answered: (a, n) => `${a} / ${n}`, recommended: "recommended", optional: "optional", other: "Other",
    otherPh: "Type your own answer…", textPh: "Your answer…", multiHint: "You can pick several",
    rankHint: "Drag or use the arrows to reorder — top comes first", moveUp: "Move up", moveDown: "Move down",
    delegate: "Let Claude decide", delegateOn: "Claude decides — undo", note: "Add a note", noteOn: "Hide note",
    notePh: "Additional note (optional)", submit: "Submit answers", sending: "Sending…",
    missing: n => `${n} question${n === 1 ? "" : "s"} left`,
    ready: "All answered", kbd: " · submit",
    doneTitle: "Submitted", doneText: "Claude has your answers. You can close this tab and go back to the terminal.",
    error: "Submit failed: ", offline: "server not responding (already submitted or timed out)",
    theme: { auto: "Theme: system", light: "Theme: light", dark: "Theme: dark" },
  },
};
const T = STRINGS.en;
const QS = DATA.questions;
const BY_ID = Object.fromEntries(QS.map(q => [q.id, q]));
const TOKEN = new URLSearchParams(location.search).get("t") || DATA.token;
const DRAFT_KEY = "ask-form-draft:" + DATA.token;
const $ = s => document.querySelector(s);

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === "html") e.innerHTML = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k);
  return e;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmt(s) {
  return esc(s || "").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
}

/* ---------- theme ---------- */
const ICONS = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
};
let theme = ["auto", "light", "dark"].includes(DATA.prefs?.theme) ? DATA.prefs.theme : "auto";
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  const b = $("#theme");
  b.innerHTML = ICONS[theme];
  b.title = T.theme[theme];
  b.setAttribute("aria-label", T.theme[theme]);
}
$("#theme").addEventListener("click", () => {
  theme = { auto: "light", light: "dark", dark: "auto" }[theme];
  applyTheme();
  fetch("/pref?t=" + encodeURIComponent(TOKEN), { method: "POST", body: JSON.stringify({ theme }) }).catch(() => {});
});

/* ---------- render ---------- */
function optionLabel(o) {
  return h("span", { class: "opt-label", html: fmt(o.label) + (o.recommended ? ` <span class="badge">${T.recommended}</span>` : "") });
}
function optionExtras(o) {
  return [
    o.description ? h("span", { class: "opt-desc", html: fmt(o.description) }) : null,
    o.preview ? h("pre", { class: "preview" }, String(o.preview)) : null,
  ];
}

function renderChoice(q) {
  const multi = q.type === "multi";
  const name = "q-" + q.id;
  const recs = q.options.map((o, i) => o.recommended ? i : -1).filter(i => i >= 0);
  const pre = multi ? recs : recs.slice(0, 1);
  const kids = [];
  if (multi) kids.push(h("p", { class: "multi-hint" }, T.multiHint));
  const opts = h("div", { class: "opts" });
  kids.push(opts);
  q.options.forEach((o, i) => {
    opts.append(h("label", { class: "opt" },
      h("input", { class: "choice", type: multi ? "checkbox" : "radio", name, value: String(i), checked: pre.includes(i) }),
      h("span", { class: "opt-main" }, optionLabel(o), ...optionExtras(o))));
  });
  if (q.allowOther) {
    const radio = h("input", { class: "choice", type: multi ? "checkbox" : "radio", name, value: "__other" });
    const text = h("input", { class: "other-text", type: "text", placeholder: T.otherPh, "aria-label": T.other });
    text.addEventListener("input", () => { if (text.value.trim() && !radio.checked) { radio.checked = true; } });
    text.addEventListener("focus", () => { if (!multi) radio.checked = true; update(); });
    radio.addEventListener("change", () => { if (radio.checked) text.focus(); });
    opts.append(h("label", { class: "opt opt-other" }, radio,
      h("span", { class: "opt-main" }, h("span", { class: "opt-label" }, T.other), text)));
  }
  return kids;
}

let dragging = null;
function moveRank(li, dir) {
  const sib = dir < 0 ? li.previousElementSibling : li.nextElementSibling;
  if (!sib) return;
  if (dir < 0) sib.before(li); else sib.after(li);
  update();
}
function rankItem(o) {
  const li = h("li", { class: "rank-item", draggable: "true", "data-label": o.label },
    h("span", { class: "rank-pos", "aria-hidden": "true" }),
    h("span", { class: "grip", "aria-hidden": "true" }, "⠿"),
    h("span", { class: "opt-main" }, optionLabel(o), ...optionExtras(o)),
    h("span", { class: "rank-btns" },
      h("button", { type: "button", class: "rank-btn", "aria-label": T.moveUp, title: T.moveUp, onclick: () => moveRank(li, -1) }, "↑"),
      h("button", { type: "button", class: "rank-btn", "aria-label": T.moveDown, title: T.moveDown, onclick: () => moveRank(li, 1) }, "↓")));
  li.addEventListener("dragstart", e => {
    if (li.closest(".card").classList.contains("delegated")) return e.preventDefault();
    dragging = li; li.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", o.label);
  });
  li.addEventListener("dragend", () => { li.classList.remove("dragging"); dragging = null; update(); });
  li.addEventListener("dragover", e => {
    if (!dragging || dragging === li || dragging.parentNode !== li.parentNode) return;
    e.preventDefault();
    const r = li.getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) li.before(dragging); else li.after(dragging);
  });
  return li;
}
function renderRank(q) {
  return [h("p", { class: "multi-hint" }, q.hint || T.rankHint), h("ol", { class: "rank" }, q.options.map(rankItem))];
}

function renderScale(q) {
  const row = h("div", { class: "scale" });
  for (let v = q.min; v <= q.max; v++) {
    row.append(h("label", { class: "scale-opt" },
      h("input", { class: "scale-input", type: "radio", name: "q-" + q.id, value: String(v), checked: q.default === v }),
      h("span", {}, String(v))));
  }
  const labels = q.minLabel || q.maxLabel
    ? h("div", { class: "scale-labels" }, h("span", {}, q.minLabel || ""), h("span", {}, q.maxLabel || ""))
    : null;
  return [h("div", { class: "scale-wrap" }, row, labels)];
}

function renderQuestion(q) {
  const card = h("article", { class: "card" + (q.showIf ? " cond" : ""), id: "card-" + q.id, "data-id": q.id });
  const head = h("div", { class: "q-head" },
    h("span", { class: "num", "aria-hidden": "true" }),
    h("div", {},
      h("h2", { class: "q-text", id: "qt-" + q.id, html: fmt(q.question) + (q.optional ? ` <span class="badge optional">${T.optional}</span>` : "") }),
      q.context ? h("p", { class: "q-context", html: fmt(q.context) }) : null));
  const body = h("fieldset", { class: "q-body", "aria-labelledby": "qt-" + q.id });
  if (q.type === "text") {
    const ta = h("textarea", { class: "answer-text", placeholder: q.placeholder || T.textPh, rows: q.rows || 3 });
    ta.value = q.default || "";
    body.append(ta);
  } else if (q.type === "rank") {
    body.append(...renderRank(q));
  } else if (q.type === "scale") {
    body.append(...renderScale(q));
  } else {
    body.append(...renderChoice(q));
  }

  const noteWrap = h("div", { class: "note-wrap", hidden: true }, h("textarea", { class: "note", placeholder: T.notePh }));
  const delBtn = h("button", { type: "button", class: "link-btn del-btn", "aria-pressed": "false" }, T.delegate);
  const noteBtn = h("button", { type: "button", class: "link-btn note-btn", "aria-expanded": "false" }, T.note);
  delBtn.addEventListener("click", () => setDelegated(card, !card.classList.contains("delegated")));
  noteBtn.addEventListener("click", () => setNoteOpen(card, noteWrap.hidden, true));

  card.append(head, body, h("div", { class: "q-foot" }, delBtn, noteBtn), noteWrap);
  return card;
}

function setDelegated(card, on) {
  card.classList.toggle("delegated", on);
  card.querySelector(".q-body").disabled = on;
  card.querySelectorAll(".rank-item").forEach(li => li.draggable = !on);
  const b = card.querySelector(".del-btn");
  b.setAttribute("aria-pressed", String(on));
  b.textContent = on ? T.delegateOn : T.delegate;
  update();
}
function setNoteOpen(card, open, focus) {
  const wrap = card.querySelector(".note-wrap");
  wrap.hidden = !open;
  const b = card.querySelector(".note-btn");
  b.setAttribute("aria-expanded", String(open));
  b.textContent = open ? T.noteOn : T.note;
  if (open && focus) wrap.querySelector("textarea").focus();
}

/* ---------- state ---------- */
function card(q) { return document.getElementById("card-" + q.id); }
function collectOne(q) {
  const c = card(q);
  const a = { delegated: c.classList.contains("delegated"), note: c.querySelector(".note").value.trim() };
  if (q.type === "text") {
    a.text = c.querySelector(".answer-text").value.trim();
  } else if (q.type === "rank") {
    a.ranking = [...c.querySelectorAll(".rank-item")].map(li => li.dataset.label);
  } else if (q.type === "scale") {
    const x = c.querySelector(".scale-input:checked");
    a.value = x ? +x.value : null;
  } else {
    const checked = [...c.querySelectorAll("input.choice:checked")];
    a.selected = checked.filter(x => x.value !== "__other").map(x => q.options[+x.value].label);
    const other = checked.some(x => x.value === "__other");
    a.other = other ? c.querySelector(".other-text").value.trim() : null;
  }
  return a;
}
function hasAnswer(q, a) {
  if (a.delegated) return true;
  if (q.type === "text") return !!a.text;
  if (q.type === "rank") return a.ranking.length > 0;
  if (q.type === "scale") return a.value !== null;
  if (a.other !== null && !a.other) return false;
  return a.selected.length > 0 || !!a.other;
}
/* showIf: {question, anyOf}. Hidden when the referenced question is hidden, delegated, or has none of the values. */
function isVisible(q, answers, seen = new Set()) {
  const cond = q.showIf;
  if (!cond) return true;
  const ref = BY_ID[cond.question];
  if (!ref || seen.has(q.id)) return true;
  seen.add(q.id);
  if (!isVisible(ref, answers, seen)) return false;
  const a = answers[ref.id];
  if (!a || a.delegated) return false;
  const picked = [...(a.selected || [])];
  if (a.other) picked.push("__other");
  if (a.value != null) picked.push(a.value);
  const want = Array.isArray(cond.anyOf) ? cond.anyOf : [cond.anyOf];
  return want.some(v => picked.includes(v));
}
function isAnswered(q, a, visible) { return !visible || !!q.optional || hasAnswer(q, a); }
function collectAll() { return Object.fromEntries(QS.map(q => [q.id, collectOne(q)])); }

const sectionHeads = [];
function update() {
  const answers = collectAll();
  const vis = Object.fromEntries(QS.map(q => [q.id, isVisible(q, answers)]));
  let done = 0, total = 0, n = 0;
  for (const q of QS) {
    const c = card(q);
    c.hidden = !vis[q.id];
    if (!vis[q.id]) continue;
    c.querySelector(".num").textContent = String(++n);
    c.classList.toggle("answered", hasAnswer(q, answers[q.id]));
    if (isAnswered(q, answers[q.id], true)) c.classList.remove("attention");
    if (!q.optional) { total++; if (hasAnswer(q, answers[q.id])) done++; }
  }
  for (const s of sectionHeads) s.el.hidden = !s.ids.some(id => vis[id]);
  $("#progress-text").textContent = T.answered(done, total);
  const fill = $("#bar-fill");
  fill.style.width = (total ? 100 * done / total : 100) + "%";
  fill.classList.toggle("full", done === total);
  const hint = $("#hint");
  hint.className = "hint" + (done === total ? " ready" : "");
  if (done === total) hint.innerHTML = esc(T.ready) + '<span class="kbd-part">' + esc(T.kbd) + " <kbd>Ctrl</kbd>+<kbd>Enter</kbd></span>";
  else hint.textContent = T.missing(total - done);
  saveDraft(answers);
  return { answers, vis };
}

/* draft survives an accidental reload of the tab */
function saveDraft(answers) {
  try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ answers, notesOpen: QS.filter(q => !card(q).querySelector(".note-wrap").hidden).map(q => q.id) })); } catch (e) {}
}
function restoreDraft() {
  let d;
  try { d = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "null"); } catch (e) { return; }
  if (!d) return;
  for (const q of QS) {
    const a = d.answers?.[q.id]; if (!a) continue;
    const c = card(q);
    if (q.type === "text") c.querySelector(".answer-text").value = a.text || "";
    else if (q.type === "rank") {
      const list = c.querySelector(".rank");
      for (const label of a.ranking || []) {
        const li = [...list.children].find(x => x.dataset.label === label);
        if (li) list.append(li);
      }
    } else if (q.type === "scale") {
      c.querySelectorAll(".scale-input").forEach(x => { x.checked = a.value != null && +x.value === a.value; });
    } else {
      c.querySelectorAll("input.choice").forEach(x => {
        x.checked = x.value === "__other" ? a.other !== null : (a.selected || []).includes(q.options[+x.value].label);
      });
      if (a.other) c.querySelector(".other-text").value = a.other;
    }
    c.querySelector(".note").value = a.note || "";
    if (a.note || d.notesOpen?.includes(q.id)) setNoteOpen(c, true, false);
    if (a.delegated) setDelegated(c, true);
  }
}

function focusTarget(c) {
  return c.querySelector("input.choice:checked, input.scale-input:checked, textarea.answer-text, input.choice, input.scale-input, .rank-btn");
}

/* ---------- submit ---------- */
let sending = false;
async function submit() {
  if (sending) return;
  const { answers, vis } = update();
  const missing = QS.filter(q => !isAnswered(q, answers[q.id], vis[q.id]));
  if (missing.length) {
    missing.forEach(q => { const c = card(q); c.classList.remove("attention"); void c.offsetWidth; c.classList.add("attention"); });
    const first = card(missing[0]);
    first.scrollIntoView({ behavior: "smooth", block: "start" });
    setTimeout(() => focusTarget(first)?.focus({ preventScroll: true }), 350);
    return;
  }
  sending = true;
  const btn = $("#submit");
  btn.disabled = true; btn.textContent = T.sending;
  try {
    const r = await fetch("/submit?t=" + encodeURIComponent(TOKEN), { method: "POST", body: JSON.stringify({ answers }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.missing ? T.missing(j.missing.length) : (j.error || r.status));
    try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
    $("#done").hidden = false;
    document.title = T.doneTitle;
  } catch (e) {
    const hint = $("#hint");
    hint.className = "hint error";
    hint.textContent = T.error + (e instanceof TypeError ? T.offline : e.message);
    btn.disabled = false; btn.textContent = T.submit; sending = false;
  }
}

/* ---------- boot ---------- */
document.title = DATA.project ? `${DATA.project} · ${DATA.title}` : DATA.title;
if (DATA.project) $("#title").append(h("span", { class: "proj", title: DATA.project }, DATA.project));
$("#title").append(DATA.title);
$("#intro").innerHTML = fmt(DATA.intro || "");
$("#submit").textContent = T.submit;
$("#done-title").textContent = T.doneTitle;
$("#done-text").textContent = T.doneText;
applyTheme();

const form = $("#form");
let lastSection = null;
for (const q of QS) {
  if (q.section && q.section !== lastSection) {
    const el = h("h3", { class: "section-title" }, q.section);
    sectionHeads.push({ el, ids: [] });
    form.append(el);
  }
  if (q.section) sectionHeads[sectionHeads.length - 1].ids.push(q.id);
  lastSection = q.section || lastSection;
  form.append(renderQuestion(q));
}
restoreDraft();
form.addEventListener("input", update);
form.addEventListener("change", update);
form.addEventListener("submit", e => e.preventDefault());
$("#submit").addEventListener("click", submit);
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
});
update();
</script>
</body>
</html>
